[project]
name = "autoresearch"
version = "0.1.0"
description = "Autonomous pretraining research swarm"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "kernels>=0.11.7",
    "matplotlib>=3.10.8",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "pyarrow>=21.0.0",
    "pytorch-triton-rocm==3.5.1; sys_platform == 'linux'",
    "requests>=2.32.0",
    "rustbpe>=0.1.0",
    "tiktoken>=0.11.0",
    "torch==2.9.1; sys_platform == 'linux'",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-rocm64" },
]
pytorch-triton-rocm = [
    { index = "pytorch-rocm-base" },
]

[[tool.uv.index]]
name = "pytorch-rocm64"
url = "https://download.pytorch.org/whl/rocm6.4"
explicit = true

[[tool.uv.index]]
name = "pytorch-rocm-base"
url = "https://download.pytorch.org/whl"
explicit = true
